  // =========================================================

    { id: 2, nombre: "Dxn Lingzhi Black Coffee", categoria: "bebidas", categoria: "bebidas", cliente: 36.60, distribuidor: 24.60 },

  let cantidadesSeleccionadas = {};
  let carrito = [];
  let distribuidorValidado = false;
  let nombreDistribuidorActivo = "";

  document.addEventListener("DOMContentLoaded", () => {
    productos.forEach(p => { cantidadesSeleccionadas[p.id] = 1; });
    renderProductos(productos);
  });

  function renderProductos(lista) {
    const grid = document.getElementById("gridProductos");
    grid.innerHTML = "";
    lista.forEach(p => {
      const cant = cantidadesSeleccionadas[p.id] || 1;
      const totalAcumulado = p.cliente * cant;

      grid.innerHTML += `
        <div class="product-card">
          <div class="product-info">
            <div class="product-title">${p.nombre}</div>
            <div class="prices">
              <div class="price-tag">Cliente <span>$${p.cliente.toFixed(2)}</span></div>
              <div class="price-tag">Distribuidor <span>$${p.distribuidor.toFixed(2)}</span></div>
            </div>
          </div>
          <div style="padding: 0 15px 15px;">
            <div class="qty-control">
              <button class="qty-btn" onclick="cambiarCantidad(${p.id}, -1)">-</button>
              <span class="qty-val" id="qty-val-${p.id}">${cant}</span>
              <button class="qty-btn" onclick="cambiarCantidad(${p.id}, 1)">+</button>
            </div>
            <div class="card-total-preview" id="preview-${p.id}">Subtotal: $${totalAcumulado.toFixed(2)}</div>
            <button class="btn-add" onclick="agregarAlCarrito(${p.id})">🛒 Agregar al Carrito</button>
          </div>
        </div>
      `;
    });
  }

  function cambiarCantidad(id, cambio) {
    let actual = cantidadesSeleccionadas[id] || 1;
    actual += cambio;
    if (actual < 1) actual = 1;
    cantidadesSeleccionadas[id] = actual;

    const elQty = document.getElementById(`qty-val-${id}`);
    const elPrev = document.getElementById(`preview-${id}`);
    const prod = productos.find(p => p.id === id);

    if (elQty && elPrev && prod) {
      elQty.innerText = actual;
      const subtotal = prod.cliente * actual;
      elPrev.innerText = `Subtotal: $${subtotal.toFixed(2)}`;
    }
  }

  function filtrar(cat) {
    document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    if (cat === 'todos') {
      renderProductos(productos);
    } else {
      renderProductos(productos.filter(p => p.categoria === cat));
    }
  }

  function agregarAlCarrito(id) {
    const prod = productos.find(p => p.id === id);
    const cantElegida = cantidadesSeleccionadas[id] || 1;
    const existe = carrito.find(item => item.id === id);
    
    if (existe) {
      existe.cantidad += cantElegida;
    } else {
      carrito.push({ ...prod, cantidad: cantElegida });
    }
    actualizarContadorCarrito();
    cantidadesSeleccionadas[id] = 1;
    cambiarCantidad(id, 0);
  }

  function actualizarContadorCarrito() {
    const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
    document.getElementById("cartCount").innerText = totalItems;
  }

  function abrirCarrito() {
    document.getElementById("modalCarrito").style.display = "flex";
    cambiarTipoComprador();
  }

  function cerrarCarrito() {
    document.getElementById("modalCarrito").style.display = "none";
  }

  function cambiarTipoComprador() {
    const tipo = document.getElementById("tipoPrecio").value;
    const secVerif = document.getElementById("secVerificacion");

    if (tipo === "distribuidor") {
      secVerif.style.display = "block";
      if (distribuidorValidado) {
        document.getElementById("msgVerificacion").innerHTML = `<span style="color: green; font-weight: bold;">✔ Verificado: ${nombreDistribuidorActivo}</span>`;
      }
    } else {
      secVerif.style.display = "none";
    }
    actualizarCarritoView();
  }

  // =========================================================
  // GESTIÓN DE BASE DE DATOS (NUBE + LOCAL BACKUP)
  // =========================================================
  async function obtenerBaseDatos() {
    let localDB = localStorage.getItem("dxn_db_backup");
    let localObj = localDB ? JSON.parse(localDB) : { clientes: {}, distribuidores: {} };

    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_KEY }
      });
      if (res.ok) {
        const data = await res.json();
        let cloudRecord = data.record || {};
        
        // Fusión de datos (Local + Nube)
        let mergedDB = {
          clientes: { ...(cloudRecord.clientes || {}), ...(localObj.clientes || {}) },
          distribuidores: { ...(cloudRecord.distribuidores || {}), ...(localObj.distribuidores || {}) }
        };

        // Guardar copia local sincronizada
        localStorage.setItem("dxn_db_backup", JSON.stringify(mergedDB));
        return mergedDB;
      }
    } catch (err) {
      console.warn("Modo Offline / Usando datos locales:", err);
    }

    return localObj;
  }

  async function guardarEnNubeYLocal(dbActualizada) {
    // 1. Guardado inmediato en LocalStorage
    localStorage.setItem("dxn_db_backup", JSON.stringify(dbActualizada));

    // 2. Envío a la nube
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': JSONBIN_KEY
        },
        body: JSON.stringify(dbActualizada)
      });

      return res.ok;
    } catch (err) {
      console.error("Error al sincronizar con la nube:", err);
      return false;
    }
  }

  // =========================================================
  // VALIDACIÓN DE DISTRIBUIDOR EN CARRITO
  // =========================================================
  async function validarCodigoDistribuidor() {
    const inputVal = document.getElementById("codigoDistribuidor").value.trim();
    const msgBox = document.getElementById("msgVerificacion");

    if (!inputVal) {
      msgBox.innerHTML = "<span style='color: red;'>Ingresa un código.</span>";
      return;
    }

    msgBox.innerHTML = "<span style='color: #666;'>Verificando...</span>";

    const db = await obtenerBaseDatos();
    const distribuidores = db.distribuidores || {};

    // Normalizar texto eliminando espacios y convirtiendo a minúsculas
    const codBuscado = inputVal.replace(/\s+/g, '').toLowerCase();

    let llaveEncontrada = Object.keys(distribuidores).find(
      key => key.toString().replace(/\s+/g, '').toLowerCase() === codBuscado
    );

    if (llaveEncontrada) {
      distribuidorValidado = true;
      nombreDistribuidorActivo = distribuidores[llaveEncontrada];
      msgBox.innerHTML = `<span style="color: green; font-weight: bold;">✔ Válido: ${nombreDistribuidorActivo}</span>`;
    } else {
      distribuidorValidado = false;
      nombreDistribuidorActivo = "";
      msgBox.innerHTML = `<span style="color: red;">❌ Código (${inputVal}) no registrado.</span>`;
    }

    actualizarCarritoView();
  }

  function actualizarCarritoView() {
    const container = document.getElementById("cartItemsContainer");
    const tipo = document.getElementById("tipoPrecio").value;
    const esDistribuidorValido = (tipo === "distribuidor" && distribuidorValidado);
    
    container.innerHTML = "";

    if (carrito.length === 0) {
      container.innerHTML = "<p style='text-align:center; color:#888;'>El carrito está vacío.</p>";
      document.getElementById("cartTotal").innerText = "0.00";
      return;
    }

    let total = 0;
    carrito.forEach((item, index) => {
      const precioUnitario = esDistribuidorValido ? item.distribuidor : item.cliente;
      const subtotal = precioUnitario * item.cantidad;
      total += subtotal;

      container.innerHTML += `
        <div class="cart-item">
          <div>
            <strong>${item.nombre}</strong><br>
            <small>Cant: ${item.cantidad} x $${precioUnitario.toFixed(2)}</small>
          </div>
          <div>
            <span style="font-weight:bold; margin-right:10px;">$${subtotal.toFixed(2)}</span>
            <button class="cart-item-btn" onclick="eliminarDelCarrito(${index})">✕</button>
          </div>
        </div>
      `;
    });

    document.getElementById("cartTotal").innerText = total.toFixed(2);
  }

  function eliminarDelCarrito(index) {
    carrito.splice(index, 1);
    actualizarContadorCarrito();
    actualizarCarritoView();
  }

  function enviarPedidoWhatsApp() {
    if (carrito.length === 0) {
      alert("Tu carrito está vacío.");
      return;
    }

    const tipo = document.getElementById("tipoPrecio").value;

    if (tipo === "distribuidor" && !distribuidorValidado) {
      alert("Debes ingresar un código válido de distribuidor.");
      return;
    }

    const tipoTexto = tipo === "distribuidor" ? `Distribuidor Afiliado (${nombreDistribuidorActivo})` : "Cliente Final";
    let mensaje = `Hola DXN Salud & Vida, deseo realizar el siguiente pedido como *${tipoTexto}*:\n\n`;

    let total = 0;
    carrito.forEach(item => {
      const precioUnitario = (tipo === "distribuidor" && distribuidorValidado) ? item.distribuidor : item.cliente;
      const subtotal = precioUnitario * item.cantidad;
      total += subtotal;
      mensaje += `• *${item.cantidad}x* ${item.nombre} ($${subtotal.toFixed(2)})\n`;
    });

    mensaje += `\n*Total a pagar:* $${total.toFixed(2)}\n\n¿Me indican los datos para concretar el pago y envío?`;

    window.open(`https://wa.me/593990689086?text=${encodeURIComponent(mensaje)}`, '_blank');
  }

  // =========================================================
  // BÚSQUEDA PÚBLICA DE PUNTOS PV
  // =========================================================
  async function buscarPV() {
    const query = document.getElementById("inputCedula").value.trim().toLowerCase();
    const check = document.getElementById("checkConfirm").checked;
    const resBox = document.getElementById("resultadoPV");

    if (!query) {
      alert("Ingresa un número de cédula, código o nombre.");
      return;
    }
    if (!check) {
      alert("Debes confirmar que consultas tu propia información.");
      return;
    }

    resBox.style.display = "block";
    resBox.innerHTML = "<p>Buscando...</p>";

    const db = await obtenerBaseDatos();
    const clientes = db.clientes || {};

    let html = "";
    let encontrado = false;

    Object.keys(clientes).forEach(ced => {
      const c = clientes[ced];
      const nom = c.nombre ? c.nombre.toLowerCase() : "";
      if (ced.toLowerCase() === query || nom.includes(query)) {
        encontrado = true;
        html += `
          <h4 style="color: var(--primary);">¡Hola, ${c.nombre}!</h4>
          <p style="font-size: 1.1rem; margin-top: 5px;">Tienes un total acumulado de: <strong>${c.pv} PV</strong></p>
        `;
      }
    });

    if (!encontrado) {
      resBox.innerHTML = `<p style="color: #c00;">No se encontró información de PV para "${query}".</p>`;
    } else {
      resBox.innerHTML = html;
    }
  }

    if (pin === PIN_ADMIN) {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("adminPanelSection").style.display = "block";
    } else {
      alert("PIN Incorrecto.");
    }
  }

  async function adminBuscarAfiliado() {
    const query = document.getElementById("adminSearchInput").value.trim().toLowerCase();
    const resBox = document.getElementById("adminSearchResult");

    if (!query) {
      resBox.innerHTML = "<span style='color:red;'>Ingresa término de búsqueda.</span>";
      return;
    }

    resBox.innerHTML = "<span>Buscando...</span>";
    const db = await obtenerBaseDatos();
    const clientes = db.clientes || {};
    const distribuidores = db.distribuidores || {};

    let html = "";
    let encontrado = false;

    Object.keys(distribuidores).forEach(cod => {
      const nombre = distribuidores[cod].toLowerCase();
      if (cod.toLowerCase().includes(query) || nombre.includes(query)) {
        encontrado = true;
        html += `<div style="background:#e8f4ea; padding:8px; border-radius:5px; margin-bottom:5px;">
          <strong>⭐ Distribuidor Afiliado:</strong><br>
          Código: ${cod}<br>
          Nombre: ${distribuidores[cod]}
        </div>`;
      }
    });

    Object.keys(clientes).forEach(ced => {
      const c = clientes[ced];
      const nombre = c.nombre ? c.nombre.toLowerCase() : "";
      if (ced.toLowerCase().includes(query) || nombre.includes(query)) {
        encontrado = true;
        html += `<div style="background:#e8f0fe; padding:8px; border-radius:5px; margin-bottom:5px;">
          <strong>📊 Registro de PV:</strong><br>
          ID: ${ced}<br>
          Nombre: ${c.nombre}<br>
          PV: <strong>${c.pv} PV</strong>
        </div>`;
      }
    });

    if (!encontrado) {
      html = `<span style="color:red;">No hay registros coincidentes.</span>`;
    }

    resBox.innerHTML = html;
  }

  async function adminVerTodos() {
    const resBox = document.getElementById("adminSearchResult");
    resBox.innerHTML = "<span>Cargando lista...</span>";

    const db = await obtenerBaseDatos();
    const clientes = db.clientes || {};
    const distribuidores = db.distribuidores || {};

    let html = "<div style='max-height: 180px; overflow-y: auto; text-align: left; background: white; padding: 10px; border: 1px solid var(--border); border-radius: 5px;'>";
    
    html += "<strong>⭐ DISTRIBUIDORES AFILIADOS:</strong><br>";
    const listDist = Object.keys(distribuidores);
    if (listDist.length === 0) {
      html += "<small style='color:#888;'>Sin distribuidores.</small><br>";
    } else {
      listDist.forEach(cod => {
        html += `<small>• <strong>${cod}</strong> - ${distribuidores[cod]}</small><br>`;
      });
    }

    html += "<br><strong>📊 REGISTROS DE PV:</strong><br>";
    const listCli = Object.keys(clientes);
    if (listCli.length === 0) {
      html += "<small style='color:#888;'>Sin registros PV.</small><br>";
    } else {
      listCli.forEach(ced => {
        html += `<small>• <strong>${ced}</strong> - ${clientes[ced].nombre} (${clientes[ced].pv} PV)</small><br>`;
      });
    }

    html += "</div>";
    resBox.innerHTML = html;
  }

  async function guardarCliente() {
    const cedula = document.getElementById("regCedula").value.trim();
    const nombre = document.getElementById("regNombre").value.trim();
    const pv = parseFloat(document.getElementById("regPV").value);

    if (!cedula || !nombre || isNaN(pv)) {
      alert("Completa todos los campos correctamente.");
      return;
    }

    const db = await obtenerBaseDatos();
    db.clientes[cedula] = { nombre: nombre, pv: pv };

    const ok = await guardarEnNubeYLocal(db);
    alert(ok ? "¡Puntos PV guardados y sincronizados con éxito!" : "¡Guardado localmente! (Sincronización remota pendiente)");

    document.getElementById("regCedula").value = "";
    document.getElementById("regNombre").value = "";
    document.getElementById("regPV").value = "";
  }

  async function guardarDistribuidor() {
    const cod = document.getElementById("regCodDistribuidor").value.trim();
    const nombre = document.getElementById("regNombreDistribuidor").value.trim();

    if (!cod || !nombre) {
      alert("Ingresa código y nombre del distribuidor.");
      return;
    }

    const db = await obtenerBaseDatos();
    db.distribuidores[cod] = nombre;

    const ok = await guardarEnNubeYLocal(db);
    alert(ok ? "¡Distribuidor guardado y sincronizado con éxito!" : "¡Guardado localmente! (Sincronización remota pendiente)");

    document.getElementById("regCodDistribuidor").value = "";
    document.getElementById("regNombreDistribuidor").value = "";
  }
</script>
